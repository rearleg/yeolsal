name: BE opt-in IT (boot-smoke)

# Purpose
# -------
# Enforces the opt-in @EnabledIfSystemProperty(named="yeosal.boot-smoke", matches="true")
# Testcontainers IT layer in CI on every PR.
#
# Rationale
# ---------
# Epic 1 retrospective (2026-05-14) action item T3.
#
# On 2026-05-13 the first real production cutover of V11 failed at line 68
# (SQLSTATE 42P17 — functions in index expression must be marked IMMUTABLE).
# The V11MigrationIT that would have caught this was deferred during Story 1.4
# because Docker was unavailable on the dev environment. The bug was forward-fixed
# in-place but the audit lesson is durable: never sign off a V11-class change
# without a green opt-in IT run.
#
# This workflow runs the entire opt-in IT layer on GitHub-hosted ubuntu-latest
# (Docker pre-installed), so the IT layer is *enforced* in CI even when no
# developer has Docker locally.
#
# Affected ITs (as of Story 1.7):
#   - RoomControllerIT
#   - SurvivalStateEvaluatorIT
#   - SurvivalStateRosterIT
#   - V11MigrationIT

on:
  pull_request:
    paths:
      - "BE/**"
      - "FE/src/theme/tokens.json"
      - "FE/src/theme/tokens.schema.json"
      - ".github/workflows/be-it-boot-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "BE/**"
      - "FE/src/theme/tokens.json"
      - "FE/src/theme/tokens.schema.json"
      - ".github/workflows/be-it-boot-smoke.yml"

concurrency:
  # Cancel superseded runs on the same PR / branch to save runner minutes.
  group: be-it-boot-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot-smoke:
    name: Opt-in Testcontainers IT
    runs-on: ubuntu-latest
    # Raised from 30 → 60 (2026-06-08, Epic 7 retro A1). The opt-in IT layer
    # grew past the 30-min cap on PRs #90 / #93 / #95; three PRs merged on
    # AC11 deferral allowance + `deferred-work.md` notes. See
    # `_bmad-output/implementation-artifacts/epic-7-retro-2026-06-08.md` §C1
    # for the matrix-split / nightly-schedule alternatives still open.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('BE/**/*.gradle', 'BE/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Verify Docker is available (Testcontainers prerequisite)
        run: docker version

      - name: Run BE opt-in IT layer (`-Dyeosal.boot-smoke=true`)
        working-directory: BE
        run: ./gradlew test -Dyeosal.boot-smoke=true --no-daemon --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: be-test-reports-boot-smoke
          path: |
            BE/build/reports/tests/
            BE/build/test-results/
          retention-days: 14
