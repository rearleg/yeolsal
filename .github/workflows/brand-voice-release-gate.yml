name: Brand-voice release gate

on:
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: brand-voice-release-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: PM + designer brand-voice approval
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - name: Verify release checklist and role approvals
        uses: actions/github-script@v7
        env:
          PM_REVIEWERS: ${{ vars.BRAND_VOICE_PM_REVIEWERS }}
          DESIGNER_REVIEWERS: ${{ vars.BRAND_VOICE_DESIGNER_REVIEWERS }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const headSha = context.payload.pull_request.head.sha;

            const parseReviewers = (value, role) => {
              const reviewers = new Set(
                (value ?? "")
                  .split(",")
                  .map((entry) => entry.trim().replace(/^@/, "").toLowerCase())
                  .filter(Boolean),
              );
              if (reviewers.size === 0) {
                core.setFailed(
                  `Repository variable for ${role} reviewers is empty. ` +
                  `Configure BRAND_VOICE_${role.toUpperCase()}_REVIEWERS.`,
                );
              }
              return reviewers;
            };

            const pmReviewers = parseReviewers(process.env.PM_REVIEWERS, "PM");
            const designerReviewers = parseReviewers(
              process.env.DESIGNER_REVIEWERS,
              "DESIGNER",
            );
            const overlap = [...pmReviewers].filter((login) =>
              designerReviewers.has(login),
            );
            if (overlap.length > 0) {
              core.setFailed(
                `PM and designer reviewer lists must be disjoint: ${overlap.join(", ")}`,
              );
            }

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number, per_page: 100 },
            );
            const checklistFiles = files
              .map((file) => file.filename)
              .filter((filename) =>
                /^docs\/releases\/brand-voice-review-(?!TEMPLATE\.md$).+\.md$/.test(
                  filename,
                ),
              );
            if (checklistFiles.length !== 1) {
              core.setFailed(
                `Release PR must add or update exactly one per-release brand-voice checklist; ` +
                `found ${checklistFiles.length}.`,
              );
              return;
            }

            const checklistPath = checklistFiles[0];
            const response = await github.rest.repos.getContent({
              owner,
              repo,
              path: checklistPath,
              ref: headSha,
            });
            if (Array.isArray(response.data) || response.data.type !== "file") {
              core.setFailed(`${checklistPath} is not a file.`);
              return;
            }
            const checklist = Buffer.from(response.data.content, "base64").toString(
              "utf8",
            );
            const surfaceSection =
              checklist.match(
                /## Surface checklists([\s\S]*?)(?:\n---\n|\n## Decision log)/,
              )?.[1] ?? "";
            if (!surfaceSection || /- \[ \]/.test(surfaceSection)) {
              core.setFailed("Every surface checklist item must be checked.");
            }
            if (/<fill|@<handle>|<YYYY-MM-DD>|<surface>|<file:line>/.test(checklist)) {
              core.setFailed("Release checklist still contains template placeholders.");
            }

            const decisionRows = checklist
              .split("\n")
              .filter((line) => line.startsWith("|"))
              .map((line) => line.split("|").map((cell) => cell.trim()))
              .filter((cells) => cells.length >= 9);
            for (const cells of decisionRows) {
              const decision = cells[4]?.replaceAll("`", "").toLowerCase();
              const notes = cells[7] ?? "";
              if (decision === "reject") {
                core.setFailed(`Rejected copy cannot ship: ${cells[2]}`);
              }
              if (
                decision === "needs-rewrite" &&
                !/disabled:\s*\S.+;\s*evidence:\s*https?:\/\/\S+/i.test(notes)
              ) {
                core.setFailed(
                  `needs-rewrite item must name a disable control and evidence URL: ${cells[2]}`,
                );
              }
            }

            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              { owner, repo, pull_number, per_page: 100 },
            );
            const latestState = new Map();
            const chronologicalReviews = reviews.toSorted((left, right) => {
              const leftTime = Date.parse(left.submitted_at ?? "") || 0;
              const rightTime = Date.parse(right.submitted_at ?? "") || 0;
              return leftTime - rightTime || left.id - right.id;
            });
            for (const review of chronologicalReviews) {
              const login = review.user?.login?.toLowerCase();
              if (login) latestState.set(login, review.state);
            }
            const approved = new Set(
              [...latestState.entries()]
                .filter(([, state]) => state === "APPROVED")
                .map(([login]) => login),
            );
            const pmApproval = [...pmReviewers].find((login) => approved.has(login));
            const designerApproval = [...designerReviewers].find((login) =>
              approved.has(login),
            );
            if (!pmApproval) core.setFailed("Missing approval from a designated PM reviewer.");
            if (!designerApproval) {
              core.setFailed("Missing approval from a designated designer reviewer.");
            }
            if (pmApproval && designerApproval) {
              core.info(`Approved by PM @${pmApproval} and designer @${designerApproval}.`);
            }
