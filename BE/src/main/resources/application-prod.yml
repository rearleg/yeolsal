# Production profile overrides.
#
# Activated when SPRING_PROFILES_ACTIVE=prod (or includes "prod").
# All values below intentionally have NO default; missing environment
# variables will fail context startup with a property-resolution error.
# StartupConfigValidator adds extra checks (e.g. dev placeholder strings
# rejected even when explicitly supplied).
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

yeosal:
  auth:
    jwt-secret: ${YEOSAL_JWT_SECRET}
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    redirect-uri: ${KAKAO_REDIRECT_URI}
    mobile-redirect-uri: ${KAKAO_MOBILE_REDIRECT_URI}
  cors:
    # Comma-separated list of allowed origins. Required in prod to avoid
    # falling through to the dev wildcard.
    allowed-origins: ${YEOSAL_CORS_ALLOWED_ORIGINS}
  rate-limit:
    # Production normally sits behind a proxy/ALB that strips and re-sets
    # X-Forwarded-For, so trust the header here. Override to false if the
    # API gateway terminates TLS but does NOT rewrite the header.
    trust-forwarded-for: ${YEOSAL_RATE_LIMIT_TRUST_FORWARDED_FOR:true}

# Hide the OpenAPI spec and Swagger UI in production. The schema is still
# auto-generated at build time, but the runtime endpoints (/v3/api-docs,
# /swagger-ui/**) are disabled so the API surface is not advertised.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
