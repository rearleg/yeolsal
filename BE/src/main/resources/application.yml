spring:
  application:
    name: yeosal-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/yeosal}
    username: ${SPRING_DATASOURCE_USERNAME:yeosal}
    password: ${SPRING_DATASOURCE_PASSWORD:yeosal}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/yeolsal}

yeosal:
  auth:
    jwt-secret: ${YEOSAL_JWT_SECRET:dev-only-change-me-dev-only-change-me}
    access-token-minutes: ${YEOSAL_ACCESS_TOKEN_MINUTES:30}
    refresh-token-days: ${YEOSAL_REFRESH_TOKEN_DAYS:30}
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    redirect-uri: ${KAKAO_REDIRECT_URI:https://api.rearleg.com/yeolsal/api/v1/auth/kakao/callback}
    mobile-redirect-uri: ${KAKAO_MOBILE_REDIRECT_URI:yeosal://auth/kakao}
  share:
    deeplink-base: ${YEOSAL_SHARE_DEEPLINK_BASE:https://yeolsal.app}
    preview-card-base: ${YEOSAL_SHARE_PREVIEW_CARD_BASE:https://api.rearleg.com/yeolsal}
    preview-cards-dir: ${YEOSAL_SHARE_PREVIEW_CARDS_DIR:/var/yeosal/preview-cards}
    posters-dir: ${YEOSAL_SHARE_POSTERS_DIR:/var/yeosal/posters}
  evaluator:
    mass-elimination-alert-threshold: ${YEOSAL_EVALUATOR_MASS_ELIM_THRESHOLD:20}
  realtime:
    broadcast-dispatcher-delay-ms: ${YEOSAL_REALTIME_BROADCAST_DISPATCHER_DELAY_MS:60000}
