server {
    listen 80;
    server_name _;

    location /yeolsal/api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /yeolsal/health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Story 6.1 — KakaoTalk preview card static asset. The API writes
    # PNG files to /var/yeosal/preview-cards via the shared docker volume;
    # nginx serves them directly so the 302 redirect from
    # GET /api/v1/rooms/{id}/invites/preview-card resolves without an
    # additional proxy hop. The Cache-Control header matches the server-side
    # TTL in PreviewCardCacheService (Story 6.1 trap #6 — same value, distinct
    # purpose).
    location /preview-cards/ {
        alias /var/yeosal/preview-cards/;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Story 7.1 — Final-3 ceremony poster static asset. The API writes PNG
    # files to /var/yeosal/posters via the shared docker volume; nginx serves
    # them directly so Kakao share-thumbnail fetchers (anonymous, no auth)
    # resolve in one round-trip. Posters are immutable (FR-8.7.6) so a 24h
    # cache horizon is safe (longer than preview-cards' 1h, which invalidates
    # on rule changes).
    location /posters/ {
        alias /var/yeosal/posters/;
        expires 24h;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location /yeolsal/posters/ {
        alias /var/yeosal/posters/;
        expires 24h;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
}
