services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yeosal}
      POSTGRES_USER: ${POSTGRES_USER:-yeosal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yeosal}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  api:
    build:
      # Build context is the repo root (not BE/) because BE's Gradle
      # validateTokens / generateTokens tasks (Story 1.5, Arch §4.16) read
      # FE/src/theme/tokens.json as the canonical design-system source.
      # Keeping the context at BE/ leaves tokens.json outside the docker
      # build sandbox and breaks `./gradlew bootJar` at validateTokens.
      context: ..
      dockerfile: BE/Dockerfile
      # Forwarded to BE/Dockerfile so the resulting image carries
      # /app/COMMIT. Set GIT_SHA on the host before
      # `docker compose up -d --build` (e.g. via the deploy.sh wrapper)
      # to embed the real revision; otherwise it stays "unknown".
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-yeosal}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-yeosal}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-yeosal}
      SERVER_SERVLET_CONTEXT_PATH: ${SERVER_SERVLET_CONTEXT_PATH:-/yeolsal}
      YEOSAL_JWT_SECRET: ${YEOSAL_JWT_SECRET}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-}
      KAKAO_MOBILE_REDIRECT_URI: ${KAKAO_MOBILE_REDIRECT_URI:-yeosal://auth/kakao}
      YEOSAL_ANALYTICS_ENABLED: ${YEOSAL_ANALYTICS_ENABLED:-false}
      POSTHOG_HOST: ${POSTHOG_HOST:-}
      POSTHOG_PROJECT_API_KEY: ${POSTHOG_PROJECT_API_KEY:-}
      # Story 6.1 — KakaoTalk share preview card render output directory.
      # Nginx serves files from the same mount so the API write and nginx
      # read sides see one filesystem.
      YEOSAL_SHARE_PREVIEW_CARDS_DIR: ${YEOSAL_SHARE_PREVIEW_CARDS_DIR:-/var/yeosal/preview-cards}
      YEOSAL_SHARE_DEEPLINK_BASE: ${YEOSAL_SHARE_DEEPLINK_BASE:-https://yeolsal.app}
      YEOSAL_SHARE_PREVIEW_CARD_BASE: ${YEOSAL_SHARE_PREVIEW_CARD_BASE:-https://api.rearleg.com/yeolsal}
      # Story 7.1 — Final-3 ceremony poster render output directory. Both api
      # and nginx mount the same host volume so writes are immediately served.
      YEOSAL_SHARE_POSTERS_DIR: ${YEOSAL_SHARE_POSTERS_DIR:-/var/yeosal/posters}
    depends_on:
      - postgres
    expose:
      - "8080"
    volumes:
      - preview-cards-cache:/var/yeosal/preview-cards
      - posters-cache:/var/yeosal/posters

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8088}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - preview-cards-cache:/var/yeosal/preview-cards:ro
      - posters-cache:/var/yeosal/posters:ro
    depends_on:
      - api

volumes:
  postgres-data:
  # Story 6.1 — shared host volume for KakaoTalk preview card PNGs. Both api
  # (writer) and nginx (static reader) mount it; container restarts therefore
  # do not invalidate the cache directory.
  preview-cards-cache:
  # Story 7.1 — shared host volume for Final-3 ceremony poster PNGs. Same
  # pattern as preview-cards-cache; posters are immutable (FR-8.7.6) so a
  # longer browser cache TTL is safe (see nginx default.conf).
  posters-cache:
